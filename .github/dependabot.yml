version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"
        versions: [">=8.0.0"]
      - dependency-name: "harnessrouterjs"
        versions: [">=0.2.0"]
